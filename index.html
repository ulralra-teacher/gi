<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>SDGs 프로그램 기획서</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one centered column (max 760px). Numbered step tracker on top, one task card per step, fixed prev/next bar at the bottom. */
:root{
  --bg:#F2F7F5; --surface:#FFFFFF; --ink:#13211E; --muted:#51635F; --line:#CFDDD8;
  --accent:#0B7A66; --accent-ink:#FFFFFF; --accent-soft:#D9F0EA;
  --warm:#FBEBC8; --danger:#B3261E;
  --font-display:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1614; --surface:#15221F; --ink:#E5F0ED; --muted:#9DB3AD; --line:#2A3D38;
    --accent:#4CC7AB; --accent-ink:#06211B; --accent-soft:#1B3A33;
    --warm:#3B3118; --danger:#F2B8B5; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1614; --surface:#15221F; --ink:#E5F0ED; --muted:#9DB3AD; --line:#2A3D38;
  --accent:#4CC7AB; --accent-ink:#06211B; --accent-soft:#1B3A33;
  --warm:#3B3118; --danger:#F2B8B5; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.65;padding-inline:16px;padding-block:20px 120px;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
header .eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(28px,6vw,38px);line-height:1.25;margin:2px 0 6px;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:60ch}
h2{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.3;margin:0 0 4px;text-wrap:balance}
h3{font-size:16px;margin:0 0 6px}
.tracker{display:flex;flex-direction:column;gap:8px}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--muted);font:700 15px var(--font-body);cursor:pointer;display:grid;place-items:center;padding:0}
.dot[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot.done{border-color:var(--accent);color:var(--accent)}
.stepname{font-size:14px;color:var(--muted)}
.stepname b{color:var(--ink)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:18px}
.lead{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-weight:700}
.hint{font-size:14px;color:var(--muted);margin:0}
input[type=text],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
textarea{min-height:92px;resize:vertical;line-height:1.55}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 15px var(--font-body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;line-height:1.4}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.chip[aria-pressed="true"]::before{content:"✓ "}
.chip.idea{border-radius:10px;text-align:left}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.goal{display:flex;align-items:center;gap:10px;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:9px 10px;cursor:pointer;font:500 14.5px/1.35 var(--font-body);color:var(--ink);min-width:0}
.goal[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.gn{flex:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font:700 16px var(--font-body);background:var(--gc);color:var(--gt)}
.panel{background:var(--accent-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.panel p{margin:0}
.tip{background:var(--warm);border-radius:12px;padding:12px 14px;font-size:15px}
.tip p{margin:0}
.tip p+p{margin-top:4px}
.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.cols{grid-template-columns:minmax(0,1fr)}}
.why{display:flex;flex-direction:column;gap:10px}
.why .field{background:var(--bg);border-radius:10px;padding:10px 12px}
details{background:var(--bg);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;font-weight:700}
details p{margin:8px 0 0;font-size:15px}
.tall{min-height:230px}
.sum{display:flex;flex-direction:column;gap:12px}
.sum section{border-top:1px solid var(--line);padding-top:10px}
.sum h3{color:var(--accent);margin-bottom:2px}
.sum p{margin:0;white-space:pre-wrap}
.sum .empty{color:var(--danger)}
.missing{background:var(--warm);border-radius:12px;padding:12px 14px}
.missing ul{margin:4px 0 0;padding-left:20px}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--accent)}
.btn{font:700 16px var(--font-body);border-radius:10px;padding:11px 20px;border:2px solid var(--accent);cursor:pointer;min-height:46px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;color:var(--accent)}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.navbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.navin{max-width:760px;margin-inline:auto;display:flex;align-items:center;gap:10px;justify-content:space-between}
.navin .btn{flex:none}
.navin .st{flex:1;text-align:center;font-size:13px;color:var(--muted);min-width:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;max-width:calc(100% - 32px);z-index:5}
#fallback{min-height:160px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">중1 코딩 수행평가</div>
    <h1>SDGs 프로그램 기획서</h1>
    <p>지속가능발전목표 중 하나를 골라, 내가 만들고 싶은 프로그램을 계획해 봐요. 직접 코딩하지 않아도 돼요.</p>
  </header>
  <nav class="tracker" aria-label="단계">
    <div class="dots" id="dots"></div>
    <div class="stepname" id="stepname"></div>
    <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
  </nav>
  <main class="card" id="view"></main>
</div>

<div class="navbar">
  <div class="navin">
    <button type="button" class="btn btn-ghost" id="prev">이전</button>
    <div class="st" id="navst"></div>
    <button type="button" class="btn btn-primary" id="next">다음</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const STEPS=['시작하기','목표 고르기','문제 찾기','아이디어','입력·처리·출력','화면과 마무리','점검하고 제출'];
const GOALS=[
{n:1,name:'빈곤퇴치',c:'#E5243B',t:'#fff',d:'어디에서든 모든 형태의 가난을 끝내고, 누구나 기본적인 생활을 할 수 있게 해요.',p:['학용품이 부족한 친구가 말하기 어려워한다','나눔 물품이 필요한 곳과 연결되지 않는다']},
{n:2,name:'기아종식',c:'#DDA63A',t:'#111',d:'굶는 사람이 없게 하고, 먹거리를 안정적으로 나눌 수 있게 해요.',p:['급식 잔반이 매일 많이 남는다','남은 음식이 그냥 버려진다']},
{n:3,name:'건강과 웰빙',c:'#4C9F38',t:'#fff',d:'모든 사람이 몸과 마음 모두 건강하게 살 수 있게 해요.',p:['물을 잘 안 마시고 운동도 부족하다','스마트폰을 너무 오래 쓴다']},
{n:4,name:'양질의 교육',c:'#C5192D',t:'#fff',d:'모든 사람이 공평하고 좋은 교육을 받고 평생 배울 수 있게 해요.',p:['모르는 문제를 편하게 물어볼 곳이 없다','영어 단어를 꾸준히 외우기 어렵다']},
{n:5,name:'성평등',c:'#FF3A21',t:'#111',d:'성별 때문에 차별받거나 기회를 잃는 일이 없게 해요.',p:['학급 역할이 한쪽으로 치우친다','무심코 쓰는 말에 차별이 섞여 있다']},
{n:6,name:'깨끗한 물과 위생',c:'#26BDE2',t:'#111',d:'모두가 깨끗한 물을 쓰고, 물을 아껴 쓰도록 해요.',p:['양치할 때 물을 틀어 놓는 친구가 많다','고장 난 수도꼭지나 화장실을 알릴 방법이 없다']},
{n:7,name:'깨끗한 에너지',c:'#FCC30B',t:'#111',d:'에너지를 아끼고, 모두가 깨끗한 에너지를 쓸 수 있게 해요.',p:['빈 교실에 불과 냉난방이 켜져 있다','우리 반이 전기를 얼마나 쓰는지 모른다']},
{n:8,name:'일자리와 경제성장',c:'#A21942',t:'#fff',d:'일하기 좋은 환경을 만들고, 모두에게 도움이 되는 경제를 만들어요.',p:['용돈을 어디에 썼는지 기억나지 않는다','동네 작은 가게가 잘 알려지지 않는다']},
{n:9,name:'산업, 혁신, 사회기반시설',c:'#FD6925',t:'#111',d:'튼튼한 시설과 새로운 기술로 모두가 편하게 살 수 있게 해요.',p:['학교 시설이 고장 나도 어디에 알릴지 모른다','고장 난 물건을 고쳐 쓰는 방법을 찾기 어렵다']},
{n:10,name:'불평등 감소',c:'#DD1367',t:'#fff',d:'나라 안과 밖의 차이와 차별을 줄여요.',p:['한국어가 서툰 친구가 안내문을 이해하기 어렵다','몸이 불편한 친구가 이용하기 힘든 장소가 있다']},
{n:11,name:'지속가능한 도시와 공동체',c:'#FD9D24',t:'#111',d:'우리 동네가 안전하고 살기 좋은 곳이 되게 해요.',p:['통학길에 위험한 곳이 있지만 알릴 방법이 없다','버스 도착 시간을 몰라 오래 기다린다']},
{n:12,name:'책임감 있는 소비와 생산',c:'#BF8B2E',t:'#111',d:'필요한 만큼만 쓰고, 쓰레기를 줄이며, 다시 쓰도록 해요.',p:['분리배출 방법이 헷갈려 그냥 버린다','쓰지 않는 물건을 나눌 방법이 없다']},
{n:13,name:'기후변화 대응',c:'#3F7E44',t:'#fff',d:'지구가 뜨거워지는 속도를 늦추고, 기후 변화에 대비해요.',p:['내가 만드는 탄소가 얼마인지 모른다','일회용품을 자주 쓰게 된다']},
{n:14,name:'해양 생태계 보존',c:'#0A97D9',t:'#111',d:'바다와 바다 생물을 지켜요.',p:['바다에 플라스틱 쓰레기가 쌓인다','바다 생물이 위험하다는 사실을 잘 모른다']},
{n:15,name:'육상 생태계 보존',c:'#56C02B',t:'#111',d:'숲과 땅, 그곳에 사는 동식물을 지켜요.',p:['학교 화단 식물에 물 주는 것을 자주 잊는다','멸종 위기 동물을 잘 모른다']},
{n:16,name:'평화, 정의, 강력한 제도',c:'#00689D',t:'#fff',d:'평화롭고 공정한 사회를 만들고, 누구나 도움을 요청할 수 있게 해요.',p:['학교폭력을 말하기 어렵다','학급 회의에서 의견이 공평하게 모이지 않는다']},
{n:17,name:'목표를 위한 파트너십',c:'#19486A',t:'#fff',d:'여러 사람과 기관이 힘을 모아 목표를 함께 이뤄요.',p:['다른 반과 함께하는 활동이 적다','봉사활동 참여자를 모으고 기록하기 어렵다']}
];
const PLACES=['교실','급식실','복도·계단','통학길','집','우리 동네','인터넷·스마트폰'];
const USERS=['우리 반 친구들','우리 학교 학생 전체','선생님','가족','동네 주민','나 자신'];
const FEATS=['정보 입력받기','기록 저장하기','점수·통계 계산하기','알림·안내 보여 주기','추천해 주기','퀴즈·게임 요소','그래프로 보여 주기','포인트·랭킹'];
const CONCEPTS={'변수':'값을 저장하는 상자','리스트':'여러 값을 모아 저장','조건문':'만약 ~라면 (if)','반복문':'같은 일을 여러 번','함수':'자주 쓰는 일을 묶음','입력과 출력':'받기와 보여 주기','난수':'무작위로 뽑기','이벤트':'버튼 클릭 같은 행동','연산':'더하기, 빼기 같은 계산'};
const RUBRIC=['고른 목표와 문제가 구체적으로 이어져요','기능이 문제를 해결하는 데 도움이 돼요','배운 코딩 개념이 어디에 쓰이는지 적었어요','입력, 처리, 출력 흐름이 빠짐없이 이어져요','지금 배운 수준에 조금만 더 배우면 만들 수 있어요','1~2분 안에 발표할 수 있게 준비했어요'];
const KEY='sdg-plan-v1';
const def=()=>({step:0,sid:'',name:'',goal:null,reason:'',problem:'',place:'',who:'',proof:'',pname:'',oneline:'',users:[],userOther:'',features:[],featOther:'',inp:'',proc:'',out:'',concepts:[],conceptWhy:{},screen:'',help:'',limit:'',checks:[]});
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const r=localStorage.getItem(KEY);if(r){return Object.assign(def(),JSON.parse(r));}}catch(e){}return def();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();
const goalOf=()=>GOALS.find(g=>g.n===S.goal);

function tf(key,label,hint,opt){ // text field
  opt=opt||{};
  const id='f-'+key;
  const ctl=opt.area
    ?`<textarea id="${id}" data-k="${key}" placeholder="${esc(opt.ph||'')}">${esc(S[key])}</textarea>`
    :`<input type="text" id="${id}" data-k="${key}" value="${esc(S[key])}" placeholder="${esc(opt.ph||'')}" ${opt.max?`maxlength="${opt.max}"`:''} autocomplete="off">`;
  return `<div class="field"><label for="${id}">${label}</label>${hint?`<p class="hint">${hint}</p>`:''}${ctl}</div>`;
}
function chips(group,list,mode){
  return `<div class="chips" role="group">${list.map(v=>{
    const on=mode==='single'?S[group]===v:S[group].includes(v);
    return `<button type="button" class="chip" data-${mode}="${group}" data-val="${esc(v)}" aria-pressed="${on}">${esc(v)}</button>`;
  }).join('')}</div>`;
}
function goalInfo(){
  const g=goalOf();
  if(!g)return `<p class="hint">목표를 하나 누르면 설명이 나와요.</p>`;
  return `<div class="panel"><h3>목표 ${g.n}. ${esc(g.name)}</h3><p>${esc(g.d)}</p></div>`;
}
function ideaChips(){
  const g=goalOf();
  if(!g)return `<div class="tip"><p>먼저 2단계에서 목표를 골라야 예시를 보여 줄 수 있어요.</p></div>`;
  return `<div class="field"><span class="lab">이 목표에서 이런 문제를 찾을 수 있어요</span><p class="hint">누르면 아래 칸에 들어가요. 내 생각으로 고쳐 써도 좋아요.</p><div class="chips">${g.p.map(p=>`<button type="button" class="chip idea" data-idea="${esc(p)}">${esc(p)}</button>`).join('')}</div></div>`;
}

const VIEWS=[
()=>`
<div><h2>우리가 할 일</h2><p class="lead">배운 코딩으로 세상의 문제 하나를 줄여 줄 프로그램을 계획해요. 어떤 프로그램인지 다른 사람이 읽고 이해할 수 있으면 돼요. 쓴 내용은 이 기기에 자동으로 저장돼요.</p></div>
<div class="cols" style="grid-template-columns:repeat(2,minmax(0,1fr))">
${tf('sid','학번','','')}${tf('name','이름','','')}

const PDF_FONT="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
const PDF_DISPLAY="'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
function pdfWrap(ctx,text,maxW){
  const lines=[];
  String(text).split('\n').forEach(par=>{
    if(par.trim()===''){lines.push('');return;}
    let line='';
    par.split(' ').forEach(word=>{
      const test=line?line+' '+word:word;
      if(ctx.measureText(test).width<=maxW){line=test;return;}
      if(line){lines.push(line);line='';}
      if(ctx.measureText(word).width<=maxW){line=word;return;}
      let chunk='';
      for(const ch of word){
        if(ctx.measureText(chunk+ch).width>maxW){lines.push(chunk);chunk=ch;}else chunk+=ch;
      }
      line=chunk;
    });
    lines.push(line);
  });
  return lines;
}
function pdfRound(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}
function renderPlanPages(mk){
  const PW=1240,PH=1754,M=104,CW=PW-2*M,BOT=PH-M-24,LH=46;
  const INK='#14211F',ACC='#0B7A66',MUT='#51635F',LINE='#CFDDD8';
  const pages=[];let cv,ctx,y;
  const newPage=()=>{cv=mk(PW,PH);ctx=cv.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,PW,PH);ctx.textBaseline='alphabetic';ctx.textAlign='left';pages.push(cv);y=M;};
  const body=(color)=>{ctx.font='400 28px '+PDF_FONT;ctx.fillStyle=color||INK;};
  const heading=(t)=>{ctx.font='700 28px '+PDF_FONT;ctx.fillStyle=ACC;ctx.fillText(t,M,y+28);y+=48;};
  newPage();
  const g=goalOf(),d=new Date();
  ctx.fillStyle=ACC;ctx.font='700 26px '+PDF_FONT;ctx.fillText('중1 코딩 수행평가',M,y+22);y+=44;
  ctx.fillStyle=INK;ctx.font='64px '+PDF_DISPLAY;ctx.fillText('SDGs 프로그램 기획서',M,y+52);y+=88;
  ctx.fillStyle=INK;ctx.font='500 28px '+PDF_FONT;
  ctx.fillText('학번 '+(S.sid.trim()||'-')+'     이름 '+(S.name.trim()||'-')+'     '+d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일',M,y+28);y+=60;
  if(g){
    pdfRound(ctx,M,y,56,56,12);ctx.fillStyle=g.c;ctx.fill();
    ctx.fillStyle=g.t==='#fff'?'#ffffff':'#111111';ctx.font='700 30px '+PDF_FONT;ctx.textAlign='center';ctx.fillText(String(g.n),M+28,y+39);ctx.textAlign='left';
    ctx.fillStyle=INK;ctx.font='700 30px '+PDF_FONT;ctx.fillText(g.name,M+74,y+39);y+=84;
  }
  ctx.fillStyle=LINE;ctx.fillRect(M,y,CW,3);y+=38;
  sections().forEach(s=>{
    body();
    const lines=pdfWrap(ctx,s[1]||'(비어 있음)',CW);
    if(y+48+2*LH>BOT)newPage();
    heading(s[0]);
    body(s[1]?INK:MUT);
    lines.forEach(l=>{
      if(y+LH>BOT){newPage();body(s[1]?INK:MUT);}
      ctx.fillText(l,M,y+30);y+=LH;
    });
    y+=28;
  });
  if(y+48+LH>BOT)newPage();
  heading('스스로 점검');
  RUBRIC.forEach((r,i)=>{
    body();
    const ls=pdfWrap(ctx,r,CW-52);
    if(y+ls.length*LH>BOT){newPage();}
    const on=S.checks.includes(i);
    pdfRound(ctx,M,y+8,30,30,6);
    if(on){ctx.fillStyle=ACC;ctx.fill();ctx.strokeStyle='#ffffff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(M+7,y+24);ctx.lineTo(M+13,y+31);ctx.lineTo(M+24,y+15);ctx.stroke();}
    else{ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.stroke();}
    body();
    ls.forEach((l,k)=>ctx.fillText(l,M+52,y+30+k*LH));
    y+=ls.length*LH+10;
  });
  pages.forEach((p,i)=>{
    const c=p.getContext('2d');c.fillStyle=MUT;c.font='400 22px '+PDF_FONT;c.textAlign='center';
    c.fillText((i+1)+' / '+pages.length,PW/2,PH-52);
  });
  return pages;
}
async function makePdfBlob(){
  const jsPDF=window.jspdf.jsPDF;
  const sample=sections().map(s=>s[0]+s[1]).join('')+RUBRIC.join('')+'SDGs 프로그램 기획서 중1 코딩 수행평가 학번 이름 목표 스스로 점검 0123456789 /년월일';
  try{
    if(document.fonts&&document.fonts.load){
      await Promise.all([
        document.fonts.load('400 28px "Noto Sans KR"',sample),
        document.fonts.load('500 28px "Noto Sans KR"',sample),
        document.fonts.load('700 28px "Noto Sans KR"',sample),
        document.fonts.load('64px "Jua"',sample)
      ]);
    }
  }catch(e){}
  const pages=renderPlanPages((w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;});
  const doc=new jsPDF({unit:'mm',format:'a4',compress:true});
  pages.forEach((c,i)=>{if(i)doc.addPage();doc.addImage(c.toDataURL('image/jpeg',0.95),'JPEG',0,0,210,297);});
  return doc.output('blob');
}
function pdfName(){
  const clean=s=>String(s).trim().replace(/[\\/:*?"<>|\s]+/g,'_');
  return ['SDGs기획서',clean(S.sid),clean(S.name)].filter(x=>x&&x!=='_').join('_')+'.pdf';
}
async function deliverFile(blob,name){
  let dl=null;
  try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads');}catch(e){}
  if(dl){await dl.save({filename:name,data:blob});toast('PDF를 저장했어요.');return;}
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast('PDF를 저장했어요. 다운로드 폴더를 확인해 보세요.');
}
let pdfBusy=false;
async function savePdf(){
  if(pdfBusy)return;
  if(!(window.jspdf&&window.jspdf.jsPDF)){toast('PDF 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.');return;}
  pdfBusy=true;
  const btns=[$('#pdfBtn'),$('#next')].filter(Boolean);
  btns.forEach(b=>{b.disabled=true;});
  toast('PDF를 만드는 중이에요...');
  try{
    const blob=await makePdfBlob();
    await deliverFile(blob,pdfName());
  }catch(e){
    const c=e&&e.code;
    if(c==='declined')toast('저장을 취소했어요.');
    else if(c==='unavailable'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed')toast('이 화면에서는 PDF를 저장할 수 없어요. 글로 복사하기를 사용해 주세요.');
    else toast('PDF를 만들지 못했어요. 잠시 뒤 다시 눌러 주세요.');
  }finally{
    pdfBusy=false;
    btns.forEach(b=>{b.disabled=false;});
    updateNav();
  }
}
/*PDF-END*/

$('#dots').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go);});
$('#prev').addEventListener('click',()=>go(S.step-1));
$('#next').addEventListener('click',()=>{if(S.step===STEPS.length-1)savePdf();else go(S.step+1);});
render();
</script>
